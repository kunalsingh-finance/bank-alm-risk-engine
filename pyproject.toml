[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-alm-risk-engine"
version = "1.0.0"
description = "Public-data bank balance-sheet, earnings and liquidity stress research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
include = ["bank_alm*"]

[tool.setuptools.package-data]
bank_alm = ["*.html"]
